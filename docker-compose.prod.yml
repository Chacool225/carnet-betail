# Production : API + PostgreSQL. Lancer avec : docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Variables obligatoires dans .env.prod : POSTGRES_PASSWORD, JWT_SECRET (32 caractères ou plus), CORS_ORIGINS.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: carnet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: carnet
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carnet"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://carnet:${POSTGRES_PASSWORD}@db:5432/carnet
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS manquant}
    ports:
      - "127.0.0.1:3000:3000" # exposé seulement en local : mettre un proxy HTTPS devant (voir docs/DEPLOY.md)
volumes:
  dbdata:
