# Base PostgreSQL locale. L'API peut aussi tourner sans Docker avec PGlite (voir .env.example).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carnet
      POSTGRES_PASSWORD: carnet
      POSTGRES_DB: carnet
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carnet"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dbdata:
